<ion-app>
  <ion-menu menuId="main-menu" side="start" type="overlay" content="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title>Menu (POC)</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="menuCtrl.close('main-menu')">
            <ion-icon name="close"></ion-icon>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      <p><strong>Ionic ion-menu is working!</strong></p>
      <p>This is a placeholder side drawer to verify the menu opens and closes correctly.</p>
      <p>More menu items will be added later.</p>
    </ion-content>
  </ion-menu>
    <ion-modal [isOpen]="logout_modal" class="modal-style-1" [backdropDismiss]="false">
      <ng-template>

        <div class="modal-body">
          <div class="w-full">
            <ion-row>
              <ion-col size="12" class="ion-text-center">
                <ion-text class="modal-icon bg-danger-light text-white">
                  <ion-icon name="log-out" color="danger"></ion-icon>
                </ion-text>
                <div class="modal-content">
                  <h1>Logout?</h1>
                  <p>Are you sure you want to log out of Aras Promotions?</p>
                </div>

              </ion-col>
              <ion-col size="12">
                <ion-button class="btn-primary" expand="block" (click)="confirmUserLogout()">Confirm</ion-button>
              </ion-col>
              <ion-col size="12">
                <ion-button class="btn-danger" (click)="logout(false)" expand="block">Cancel
                </ion-button>
              </ion-col>
            </ion-row>
          </div>
        </div>
      </ng-template>
    </ion-modal>
  <ion-router-outlet id="main-content" [swipeGesture]="false"></ion-router-outlet>
</ion-app>
