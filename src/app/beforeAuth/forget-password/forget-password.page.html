<ion-header class="desktop-none">
  <ion-toolbar>
    <ion-buttons>
      <ion-back-button deafultHref="/" text="" icon="arrow-back"></ion-back-button>
    </ion-buttons>
    <ion-title>Forget Password</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <form [formGroup]="forgetForm" (ngSubmit)="submit(forgetForm.value)">
    <!-- <ion-grid class="ion-padding logo-container">
      <ion-row>
        <ion-col size="12" class="ion-text-center">
          <img class="logo" src="assets/logo/logo.png" alt="">
        </ion-col>
      </ion-row>
    </ion-grid> -->
    <div class="table-grid">
      <div class="banner">
        <img class="banner-img" src="assets/logo/banner.png" alt="">
        <img class="banner-up-logo" src="assets/logo/logo.png" alt="">
      </div>

      <div class="form-grid">
        <ion-grid class="ion-padding max-w-480">
          <ion-row>
            <ion-col size="12">
              <h1 class="page-title mb-20">Forgot Password</h1>
              <p class="details mb-20">Enter the email address connected to your account.</p>
            </ion-col>
            <ion-col size="12">
              <p class="field-label">Email Address</p>
              <ion-item lines="none" detail="false" class="item-field">
                <ion-icon name="mail" slot="start"></ion-icon>
                <ion-input autocomplete="email" inputmode="email" (click)="errorMsg =''" placeholder="Enter Email Address" formControlName="email"></ion-input>
              </ion-item>
              
              <ion-text *ngIf="errorMsg" class="figma-err-text">{{errorMsg}}</ion-text>
              
              <ng-container *ngFor="let validation of validation_messages.email">
                <p *ngIf="((forgetForm.controls['email'].errors?.[validation.type]) && ((forgetForm.controls['email'].dirty) || (forgetForm.controls['email'].touched)))"
                class="danger" padding>{{ validation.message }}</p>
              </ng-container>
            </ion-col>
         
            <ion-col size="12">
              <ion-button expand="block" class="btn-primary mt-30 mb-30" type="submit"
                [disabled]="!forgetForm.valid">Send
                Code</ion-button>
            </ion-col>
            <ion-col size="12" class="ion-text-center mb-30">
              <ion-text>
                <!-- <ion-text class="font-14 text-medium cursor-pointer">Now to Fueled?</ion-text> -->
                <ion-text class="font-18 text-dark cursor-pointer font-f-theme font-w-700"
                  routerLink="/login">Login</ion-text>
              </ion-text>

            </ion-col>
          </ion-row>

        </ion-grid>
      </div>
    </div>
  </form>
</ion-content>
