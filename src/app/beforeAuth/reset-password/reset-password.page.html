<ion-header class="desktop-none">
  <ion-toolbar>
    <ion-buttons>
      <ion-back-button deafultHref="/" text="" icon="arrow-back"></ion-back-button>
    </ion-buttons>
    <ion-title>Reset Password</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <form [formGroup]="resetPasswordForm" (ngSubmit)="submit(resetPasswordForm.value)">
    <div class="table-grid">
      <div class="banner">
        <img class="banner-img" src="assets/logo/banner.png" alt="">
        <img class="banner-up-logo" src="assets/logo/logo.png" alt="">
      </div>

      <div class="form-grid">
        <ion-grid class="ion-padding max-w-480">
          <ion-row>
            <ion-col size="12">
              <h1 class="page-title mb-20">Reset Password</h1>
              <p class="details mb-20">Success! Please enter your new password below.</p>
            </ion-col>
            <ion-col size="12">
              <p class="field-label">Password</p>
              <ion-item lines="none" detail="false" class="item-field">
                <ion-icon name="lock-closed" slot="start"></ion-icon>
                <ion-input placeholder="Enter Password" [type]="passwordType" formControlName="password"></ion-input>
                <ion-icon [name]="passwordIcon" slot="end" (click)='hideShowPassword()'></ion-icon>
              </ion-item>
              <ng-container *ngFor="let validation of validation_messages.password">
                <p *ngIf="((resetPasswordForm.controls['password'].errors?.[validation.type]) && ((resetPasswordForm.controls['password'].dirty) || (resetPasswordForm.controls['password'].touched)))"
                  class="danger" padding>{{ validation.message }}</p>
              </ng-container>
            </ion-col>
            <ion-col size="12">
              <p class="field-label">Confirm Password</p>
              <ion-item lines="none" detail="false" class="item-field">
                <ion-icon name="lock-closed" slot="start"></ion-icon>
                <ion-input placeholder="Enter Password" [type]="passwordType1"
                  formControlName="password_confirmation"></ion-input>
                <ion-icon [name]="passwordIcon1" slot="end" (click)='hideShowPassword1()'></ion-icon>
              </ion-item>
              <ng-container *ngFor="let validation of validation_messages.password_confirmation">
                <p *ngIf="((resetPasswordForm.controls['password_confirmation'].errors?.[validation.type]) && ((resetPasswordForm.controls['password_confirmation'].dirty) || (resetPasswordForm.controls['password_confirmation'].touched)))"
                  class="danger" padding>{{ validation.message }}</p>
              </ng-container>
              <p *ngIf="resetPasswordForm?.get('password_confirmation')?.errors?.['confirmPasswordValidator']"
                class="danger">
                Passsword and confirm password didn't match.
              </p>
            </ion-col>
            <ion-col size="12">
              <ion-button expand="block" class="btn-primary mt-30 mb-30" type="submit"
                [disabled]="!resetPasswordForm.valid">Submit</ion-button>
            </ion-col>
            <!-- <ion-col size="12" class="ion-text-center mb-30">
          <ion-text>
            <ion-text class="font-18 text-dark cursor-pointer font-f-theme font-w-700"
              routerLink="/forget-password">Forgot Password</ion-text>
          </ion-text>
        </ion-col> -->
          </ion-row>

        </ion-grid>
      </div>
    </div>
  </form>
</ion-content>
