<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button *ngIf="params?.is_back" class="header-icon-btn" fill="clear" (click)="goBack()" aria-label="Go back">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
      <ion-button class="header-icon-btn" fill="clear" (click)="openMenu()" aria-label="Open menu">
        <ion-icon slot="icon-only" name="menu"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title [innerHTML]="params?.title"></ion-title>
    <ion-buttons slot="end" *ngIf="showNotificationBell">
      <ion-button class="header-icon-btn notification-bell-btn" [class.notification-bell-btn--shake]="notificationBellAnimating" fill="clear" (click)="goToNotifications()" aria-label="Open notifications">
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
        <ion-badge *ngIf="unreadNotificationCount > 0" class="notification-bell-btn__badge">
          {{ unreadNotificationCount > 99 ? '99+' : unreadNotificationCount }}
        </ion-badge>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <!-- Banking setup banners mirror the Laravel web portal. -->
  <ion-toolbar *ngIf="showBankBanner" class="bank-setup-toolbar">
    <div class="bank-setup-banner">
      <div class="bank-setup-banner__text">
        <strong>Payment Setup Required</strong>
        <span>Complete your Banking setup to receive payments.</span>
      </div>
      <ion-button size="small" class="bank-setup-banner__btn" (click)="goToDirectDeposit()">
        Complete Setup
      </ion-button>
    </div>
  </ion-toolbar>

  <ion-toolbar *ngIf="showBankVerificationBanner" class="bank-setup-toolbar bank-setup-toolbar--info">
    <div class="bank-setup-banner">
      <div class="bank-setup-banner__text">
        <strong>Account Under Verification</strong>
      </div>
    </div>
  </ion-toolbar>
</ion-header>
