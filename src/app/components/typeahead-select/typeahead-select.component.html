<div class="typeahead-wrapper">
  <!-- Selected chip / display -->
  <ion-item lines="none" detail="false" class="item-field typeahead-trigger" *ngIf="selectedId != null">
    <ion-label class="selected-label">{{ selectedLabel }}</ion-label>
    <ion-button fill="clear" slot="end" (click)="clear()" class="clear-btn" type="button">
      <ion-icon name="close-circle" slot="icon-only"></ion-icon>
    </ion-button>
  </ion-item>

  <!-- Search input (shown when nothing selected) -->
  <ion-item lines="none" detail="false" class="item-field" *ngIf="selectedId == null">
    <ion-input
      [placeholder]="placeholder"
      [value]="searchText"
      (ionInput)="onSearchInput($event)"
      (ionBlur)="closeDropdown()"
      (ionFocus)="openDropdown()"
      autocomplete="off"
      clearInput
    ></ion-input>
    <ion-spinner name="crescent" slot="end" *ngIf="isLoading" class="typeahead-spinner"></ion-spinner>
  </ion-item>

  <!-- Dropdown results -->
  <div class="typeahead-dropdown" *ngIf="isOpen && !isLoading">
    <div *ngIf="results.length === 0" class="typeahead-no-results">No results found</div>
    <div
      *ngFor="let item of results"
      class="typeahead-option"
      role="option" tabindex="0"
      (pointerdown)="$event.preventDefault()"
      (click)="select(item)"
      (keydown.enter)="select(item)"
    >
      {{ getLabel(item) }}
    </div>
  </div>
</div>
