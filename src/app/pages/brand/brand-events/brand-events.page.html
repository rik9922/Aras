<appHeader [params]="params"></appHeader>

<ion-content [fullscreen]="true">
    <ion-grid class="ion-padding">
        <ion-row *ngIf="!isSpinner">
            <ion-col size="12">
                Event Hours: <strong [innerHTML]="totalHours"></strong>; Ambassador Hours: <strong
                    [innerHTML]="totalHours"></strong>
            </ion-col>
            <ion-col size="12">
                <ion-button expand="block" class="btn-primary mt-20 mb-10" (click)="sendEmail()">Request
                    Event</ion-button>
            </ion-col>
        </ion-row>
        <ion-row>
            <ion-col *ngIf="!isSpinner" size="12">
                <p class="field-label">Select date</p>
                <ion-item lines="none" detail="false" class="item-field">
                    <ion-input placeholder="Select date" (ionChange)="onChange($event,'date')"
                        (ionClear)="onClear()" id="date" type="date"></ion-input>
                    <ion-icon slot="end" name="calendar-number"></ion-icon>
                </ion-item>
            </ion-col>
        </ion-row>
        <ion-row>
            <ion-col class="ion-text-center" size="12">
                <div class="table-responsive">
                    <table class="display responsive nowrap" id="brand_event" width="100%">
                        <thead>
                            <tr>
                                <th>Id</th>
                                <th>Day</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </ion-col>
        </ion-row>
    </ion-grid>

</ion-content>
