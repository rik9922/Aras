<appHeader [params]="params"></appHeader>

<ion-content [fullscreen]="true">
  <ion-grid>
      <ion-row>
        <ion-col size="12">
          <ion-button (click)="goToPage('/add-brand')" expand="block" class="btn-primary mt-20 mb-10" >
            <ion-icon name="add"></ion-icon>Add Brand</ion-button>
          <ion-button expand="block" class="btn-primary-outline mt-20 mb-10" routerLink="/admin-brand-category" >Brand Category</ion-button>
        </ion-col>
        <ion-col size="12">
            <div class="table-responsive">
              <table class="display responsive nowrap" id="brand" width="100%">
                <thead>
                  <tr>
                    <th>Name</th>
                    <!-- <th>Email</th> -->
                    <th>Active</th>
                    <th>Action</th>
                  </tr>
                </thead>                
              </table>
            </div>  
        </ion-col>
      </ion-row>
  </ion-grid>
</ion-content>
