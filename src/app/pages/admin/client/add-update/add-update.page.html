<appHeader [params]="params"></appHeader>

<ion-content [fullscreen]="true" class="client-form-page">
  <form [formGroup]="clientForm" (ngSubmit)="submit(clientForm.value)" class="form-shell">
    <section class="form-card" *ngIf="data?.id">
      <h2>QuickBooks</h2>
      <div class="locked-field">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <div>
          <span>QuickBooks ID</span>
          <strong>{{ quickbooksId }}</strong>
        </div>
      </div>
    </section>

    <section class="form-card">
      <h2>Rates</h2>
      <div class="form-grid">
        <label>
          <span>Labor Rate Per Hour</span>
          <ion-input type="number" inputmode="decimal" formControlName="default_labor_amount" placeholder="0.00"></ion-input>
        </label>
        <label>
          <span>Cup Charge</span>
          <ion-input type="number" inputmode="decimal" formControlName="default_cups_amount" placeholder="0.00"></ion-input>
        </label>
        <label>
          <span>Receipt Percent</span>
          <ion-input type="number" inputmode="numeric" formControlName="default_receipt_percent" placeholder="Optional"></ion-input>
        </label>
        <label>
          <span>Default Buyback</span>
          <ion-input type="number" inputmode="decimal" formControlName="default_buyback_amount" placeholder="0.00"></ion-input>
        </label>
      </div>
    </section>

    <section class="form-card">
      <h2>Basic Information</h2>
      <div class="form-grid">
        <label>
          <span>First Name</span>
          <ion-input formControlName="first_name" placeholder="Enter first name"></ion-input>
        </label>
        <label>
          <span>Last Name</span>
          <ion-input formControlName="last_name" placeholder="Enter last name"></ion-input>
        </label>
        <label>
          <span>Email</span>
          <ion-input type="email" [readonly]="data?.id" formControlName="email" placeholder="Enter email"></ion-input>
        </label>
        <label>
          <span>Phone</span>
          <ion-input type="tel" inputmode="numeric" maxlength="12" formControlName="phone" placeholder="Enter phone"></ion-input>
        </label>
      </div>

      <div class="status-block">
        <span>Status</span>
        <ion-radio-group mode="md" formControlName="status">
          <ion-radio value="1">Active</ion-radio>
          <ion-radio value="0">Inactive</ion-radio>
        </ion-radio-group>
        <ion-item lines="none" class="inline-check">
          <ion-checkbox slot="start" formControlName="contract_recieved"></ion-checkbox>
          <ion-label>Contract Received</ion-label>
        </ion-item>
      </div>
    </section>

    <section class="form-card">
      <h2>Associations</h2>
      <label>
        <span>Brands</span>
        <ion-select multiple="true" formControlName="brand_id" placeholder="Select brands">
          <ion-select-option *ngFor="let brand of brands" [value]="brand?.id">{{ brand?.brand_name }}</ion-select-option>
        </ion-select>
        <ion-spinner *ngIf="isSpinner && brands?.length === 0"></ion-spinner>
      </label>
      <label>
        <span>Distributors</span>
        <ion-select multiple="true" formControlName="distributor_id" placeholder="Select distributors">
          <ion-select-option *ngFor="let distributor of distributors" [value]="distributor?.id">{{ distributor?.name }}</ion-select-option>
        </ion-select>
        <ion-spinner *ngIf="isSpinner && distributors?.length === 0"></ion-spinner>
      </label>
    </section>

    <section class="form-card">
      <h2>Address</h2>
      <label>
        <span>Address</span>
        <ion-input formControlName="address" placeholder="Enter address"></ion-input>
      </label>
      <div class="form-grid">
        <label>
          <span>City</span>
          <ion-input formControlName="city" placeholder="City"></ion-input>
        </label>
        <label>
          <span>State</span>
          <ion-input formControlName="state" placeholder="State"></ion-input>
        </label>
        <label>
          <span>ZIP Code</span>
          <ion-input formControlName="zip_code" placeholder="ZIP"></ion-input>
        </label>
        <label>
          <span>Country</span>
          <ion-input formControlName="country" placeholder="USA"></ion-input>
        </label>
      </div>
    </section>

    <section class="form-card">
      <h2>Business Details</h2>
      <div class="form-grid">
        <label>
          <span>Company Name</span>
          <ion-input formControlName="company_name" placeholder="Optional"></ion-input>
        </label>
        <label>
          <span>Primary Billing Contact</span>
          <ion-input formControlName="primary_billing_contact" placeholder="Optional"></ion-input>
        </label>
      </div>
      <label>
        <span>Notes</span>
        <ion-textarea formControlName="notes" autoGrow="true" placeholder="Enter notes"></ion-textarea>
      </label>

      <div class="cc-section" formArrayName="cc_emails">
        <div class="section-line">
          <span>CC Emails</span>
          <ion-button fill="clear" type="button" (click)="addCcEmail()">
            <ion-icon name="add-circle-outline" slot="start"></ion-icon>
            Add CC
          </ion-button>
        </div>
        <div class="cc-row" *ngFor="let ctrl of ccEmails.controls; let i = index">
          <ion-input type="email" [formControlName]="i" placeholder="CC email address"></ion-input>
          <ion-button fill="clear" type="button" class="remove-button" (click)="removeCcEmail(i)">
            <ion-icon name="close-circle-outline"></ion-icon>
          </ion-button>
        </div>
      </div>
    </section>

    <section class="form-card">
      <h2>Program / Budget Tracking</h2>
      <label>
        <span>Program / Allocation Name</span>
        <ion-input formControlName="budget_program_name" placeholder="e.g. 2025 Spring Promo"></ion-input>
      </label>
      <div class="form-grid">
        <label>
          <span>Max Budget</span>
          <ion-input type="number" inputmode="decimal" formControlName="budget_max_amount" placeholder="No cap"></ion-input>
        </label>
        <label>
          <span>Max Completed Events</span>
          <ion-input type="number" inputmode="numeric" formControlName="budget_max_events" placeholder="No cap"></ion-input>
        </label>
        <label>
          <span>Warning At %</span>
          <ion-input type="number" inputmode="numeric" formControlName="budget_warn_percent"></ion-input>
        </label>
        <label>
          <span>Budget Alert Email</span>
          <ion-input type="email" formControlName="budget_alert_email" placeholder="Optional override"></ion-input>
        </label>
      </div>
      <ion-item lines="none" class="inline-check">
        <ion-checkbox slot="start" formControlName="budget_enforce"></ion-checkbox>
        <ion-label>Enforce limits</ion-label>
      </ion-item>
      <ion-item lines="none" class="inline-check">
        <ion-checkbox slot="start" formControlName="budget_require_approval"></ion-checkbox>
        <ion-label>Require approval when over limit</ion-label>
      </ion-item>
    </section>

    <section class="form-card">
      <h2>Password</h2>
      <label>
        <span>{{ data?.id ? 'Password (leave blank to keep unchanged)' : 'Password' }}</span>
        <div class="password-field">
          <ion-input [type]="passwordType" formControlName="password" placeholder="Enter password"></ion-input>
          <ion-button fill="clear" type="button" (click)="hideShowPassword()">
            <ion-icon [name]="passwordIcon"></ion-icon>
          </ion-button>
        </div>
      </label>
    </section>

    <div class="submit-bar">
      <ion-button expand="block" class="save-button" type="submit">
        {{ data?.id ? 'Update' : 'Save' }}
      </ion-button>
    </div>
  </form>
</ion-content>
