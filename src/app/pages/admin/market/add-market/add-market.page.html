<appHeader [params]="params"></appHeader>

<ion-content [fullscreen]="true">
  <ion-grid class="ion-padding">
    <form [formGroup]="marketForm" (ngSubmit)="onSubmit(marketForm.value)">
      <ion-row>
        <ion-col size="12">
          <p class="field-label">Market Name</p>
          <ion-item lines="none" detail="false" class="item-field">
            <ion-input inputmode="text" placeholder="Enter Market Name" formControlName="name"></ion-input>
          </ion-item>
          <ng-container *ngFor="let validation of validation_messages?.name">
            <p *ngIf="((marketForm.controls['name'].errors?.[validation.type]) && ((marketForm.controls['name'].dirty) || (marketForm.controls['name'].touched)))"
              class="danger" padding>{{ validation.message }}</p>
          </ng-container>
        </ion-col>

        <!-- <ion-col size="12">
          <p class="field-label">Email</p>
          <ion-item lines="none" detail="false" class="item-field">
            <ion-input [readonly]="data?.id" type="email" placeholder="Enter Email" formControlName="email"></ion-input>
          </ion-item>
          <ng-container *ngFor="let validation of validation_messages?.email">
            <p *ngIf="((marketForm.controls['email'].errors?.[validation.type]) && ((marketForm.controls['email'].dirty) || (marketForm.controls['email'].touched)))"
              class="danger" padding>{{ validation.message }}</p>
          </ng-container>
        </ion-col> -->

        <ion-col size="12">
          <p class="field-label">Description</p>
          <ion-item lines="none" detail="false" class="item-field">
            <ion-input inputmode="text" placeholder="Enter Description" formControlName="description"></ion-input>
          </ion-item>
          <ng-container *ngFor="let validation of validation_messages?.description">
            <p *ngIf="((marketForm.controls['description'].errors?.[validation.type]) && ((marketForm.controls['description'].dirty) || (marketForm.controls['description'].touched)))"
              class="danger" padding>{{ validation.message }}</p>
          </ng-container>
        </ion-col>

        <ion-col size="12">
          <p class="field-label">Location</p>
          <ion-item lines="none" detail="false" class="item-field">
            <ion-input (ionInput)="updateSearch($event)" inputmode="text" placeholder="Enter location"
              formControlName="location"></ion-input>
          </ion-item>
          <ion-list class="placelist">
            <ion-item *ngFor="let item of autocompleteItems" class="mousepointer" (click)="chooseItem(item)">
              <ion-icon name="pin" slot="start"></ion-icon> {{ item.description }}
            </ion-item>
          </ion-list>
          <ng-container *ngFor="let validation of validation_messages?.location">
            <p *ngIf="((marketForm.controls['location'].errors?.[validation.type]) && ((marketForm.controls['location'].dirty) || (marketForm.controls['location'].touched)))"
              class="danger" padding>{{ validation.message }}</p>
          </ng-container>
        </ion-col>

        <ion-col size="12">
          <p class="field-label">Division</p>
          <ion-item lines="none" detail="false" class="item-field">
            <ion-select formControlName="region" placeholder="Select Division">
              <ion-select-option value="Southeast">Southeast </ion-select-option>
              <ion-select-option value="Midwest">Midwest </ion-select-option>
            </ion-select>
            <ion-icon slot="end" name="chevron-down"></ion-icon>
          </ion-item>
          <ng-container *ngFor="let validation of validation_messages?.region">
            <p *ngIf="((marketForm.controls['region'].errors?.[validation.type]) && ((marketForm.controls['region'].dirty) || (marketForm.controls['region'].touched)))"
              class="danger" padding>{{ validation.message }}</p>
          </ng-container>
        </ion-col>

        <ion-col size="12">
          <ion-button [disabled]="!marketForm.valid" type="submit" class="btn-primary" expand="block">
            {{data?.id ? 'Update' : 'Save'}}
          </ion-button>
        </ion-col>
      </ion-row>

    </form>
  </ion-grid>


</ion-content>
