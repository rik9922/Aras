<appHeader [params]="params"></appHeader>

<ion-content [fullscreen]="true">
    <ion-grid>
        <ion-row>
            <ion-col size="6">
                <ion-button (click)="goToPage('/admin-add-manager')" expand="block" class="btn-primary mt-20 mb-10">
                    <ion-icon name="add"></ion-icon>Add Manager</ion-button>
            </ion-col>
            <ion-col size="5" class="view-inactive ion-align-self-center">
                <ion-item lines="none" class="bg-transparent">
                    <ion-checkbox (ionChange)="view_inactive($event)" slot="start"></ion-checkbox>
                    <ion-label>View Inactive</ion-label>
                </ion-item>
            </ion-col>
            <ion-col size="12">
                <div class="table-responsive">
                    <table class="display responsive nowrap" id="admin-manager" width="100%">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </ion-col>
        </ion-row>
    </ion-grid>

</ion-content>
