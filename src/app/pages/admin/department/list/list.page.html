<appHeader [params]="params"></appHeader>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row class="ion-align-items-center ion-margin-top">
      <ion-col size="9">
        <ion-item lines="none" class="search-item">
          <ion-input placeholder="Search department..." [formControl]="searchForm.controls.search"
            (ionInput)="onSearch($event)"></ion-input>
        </ion-item>
      </ion-col>
      <ion-col size="3" class="ion-text-end">
        <ion-button fill="outline" size="small" (click)="goToPage('/add-events-department')">+ Add</ion-button>
      </ion-col>
    </ion-row>

    <!-- Department Cards -->
    <ion-row class="ion-margin-top">
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let dept of departments">
        <ion-card class="dept-card">
          <ion-card-header>
            <ion-card-title class="dept-name">{{ dept.name }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <p class="dept-desc">{{ dept.description || '-' }}</p>
            <ion-button size="small" fill="outline" (click)="edit(dept?.id)">
              <ion-icon name="create" slot="start"></ion-icon> Edit
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>

    <!-- Loading spinner -->
    <div class="loading-container" *ngIf="isLoading && departments.length === 0">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <!-- No results -->
    <div class="no-results" *ngIf="!isLoading && departments.length === 0">
      <p>No departments found.</p>
    </div>

    <!-- Infinite scroll -->
    <ion-infinite-scroll threshold="100px" (ionInfinite)="onInfiniteScroll($event)" [disabled]="!hasMore || isLoading">
      <ion-infinite-scroll-content loadingSpinner="crescent" loadingText="Loading more…">
      </ion-infinite-scroll-content>
    </ion-infinite-scroll>
  </ion-grid>
</ion-content>
