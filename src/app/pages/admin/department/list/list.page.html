<appHeader [params]="params"></appHeader>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-button expand="block" (click)="goToPage('/add-events-department')" class="btn-primary mt-20 mb-10">
          <ion-icon name="add"></ion-icon>Add Department</ion-button>
      </ion-col>
      <ion-col size="12">
        <div class="table-responsive">
          <table class="display responsive nowrap" id="department" width="100%">
            <thead>
              <tr>
                <th>Name</th>
                <th>Description</th>
                <th>Action</th>
              </tr>
            </thead>
          </table>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
