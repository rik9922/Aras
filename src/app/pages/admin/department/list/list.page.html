<appHeader [params]="params"></appHeader>

<ion-content [fullscreen]="true" class="dept-page">
  <!-- Search + Add Row -->
  <div class="search-bar">
    <div class="search-wrapper">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <ion-input placeholder="Search department..." [formControl]="searchForm.controls.search"
        (ionInput)="onSearch($event)" class="search-input"></ion-input>
    </div>
    <ion-button class="add-btn" (click)="goToPage('/add-events-department')">
      <ion-icon name="add" slot="start"></ion-icon>
      Add
    </ion-button>
  </div>

  <!-- Department Cards -->
  <div class="dept-list">
    <div class="dept-card" *ngFor="let dept of departments">
      <!-- Icon Container -->
      <div class="dept-icon-box">
        <ion-icon name="business-outline"></ion-icon>
      </div>
      <!-- Text Content -->
      <div class="dept-text">
        <div class="dept-title">{{ dept.name }}</div>
        <div class="dept-desc">{{ dept.description || '-' }}</div>
      </div>
      <div class="dept-actions">
        <ion-button class="edit-btn" size="small" fill="outline" (click)="edit(dept)">
          <ion-icon name="create-outline" slot="start"></ion-icon>
          Edit
        </ion-button>
        <ion-button class="delete-btn" size="small" fill="outline" (click)="confirmDelete(dept)">
          <ion-icon name="trash-outline" slot="start"></ion-icon>
          Delete
        </ion-button>
      </div>
    </div>

    <!-- Loading spinner (initial load) -->
    <div class="loading-container" *ngIf="isLoading && departments.length === 0">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <!-- No results -->
    <div class="no-results" *ngIf="!isLoading && departments.length === 0">
      <p>No departments found.</p>
    </div>
  </div>

  <!-- Infinite scroll -->
  <ion-infinite-scroll threshold="100px" (ionInfinite)="onInfiniteScroll($event)" [disabled]="!hasMore || isLoading"
    class="infinite-scroll-area">
    <ion-infinite-scroll-content loadingSpinner="crescent" loadingText="Scroll to load more">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
