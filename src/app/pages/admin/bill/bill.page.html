<appHeader [params]="params"></appHeader>
<ion-content [fullscreen]="true">
  <ion-grid class="ion-padding">
      <ion-row>
          <ion-col size="12" >
              <h1 class="page-title">Search Billables</h1>
          </ion-col>
          <ion-col size="6">
            <ion-item lines="none" detail="false" class="item-field">
                <ion-input  placeholder="Billable by name"></ion-input>
              </ion-item>
          </ion-col>
          <ion-col size="6">
            <ion-item lines="none" detail="false" class="item-field">
                <ion-input  placeholder="QuickBook ID"></ion-input>
              </ion-item>
          </ion-col>
          <ion-col size="6">
            <ion-item lines="none" detail="false" class="checkBoxItem">
                <ion-checkbox slot="start"></ion-checkbox>
                <ion-label>Active</ion-label>
              </ion-item>
          </ion-col>
          <ion-col size="6">
            <ion-item lines="none" detail="false" class="checkBoxItem">
                <ion-checkbox slot="start"></ion-checkbox>
                <ion-label>Contract Received</ion-label>
              </ion-item>
          </ion-col>
          <ion-col size="6">
            <ion-button expand="block" class="btn-primary-outline mt-20 mb-10" >Reset</ion-button>
          </ion-col>
          <ion-col size="6">
            <ion-button expand="block" class="btn-primary mt-20 mb-10" >Export</ion-button>
          </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
            <div class="table-responsive">
                <table id="admin_bill" class="display responsive nowrap" width="100%">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>QuickBooks ID</th>
                            <th>Contract Received</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>180 promotions</td>
                            <td>23664</td>
                            <td>Yes</td>
                            <td>
                                <ion-button expand="block" class="btn-primary" >Edit</ion-button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </ion-col>            
        </ion-row>
  </ion-grid>
</ion-content>
