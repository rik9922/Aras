<appHeader [params]="params"></appHeader>

<ion-content [fullscreen]="true">

  <ion-grid class="ion-padding max-w-480">
    <form [formGroup]="distributorForm" (ngSubmit)="submit(distributorForm.value)">
      <ion-row>
        <ion-col size="12">
          <p class="field-label">Name</p>
          <ion-item lines="none" detail="false" class="item-field">
            <ion-input placeholder="Enter name" formControlName="name"></ion-input>
          </ion-item>
          <ng-container *ngFor="let validation of validation_messages?.name">
            <p *ngIf="((distributorForm.controls['name'].errors?.[validation.type]) && ((distributorForm.controls['name'].dirty) || (distributorForm.controls['name'].touched)))"
              class="danger" padding>{{ validation.message }}</p>
          </ng-container>
        </ion-col>
