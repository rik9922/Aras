<appHeader [params]="params"></appHeader>

<ion-content [fullscreen]="true">
   <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-button (click)="goToPage('/admin-add-pos-user')" expand="block" class="btn-primary mt-20 mb-10">
          <ion-icon name="person-add"></ion-icon>Add POS User</ion-button>
      </ion-col>
      <ion-col size="12">
        <div class="table-responsive">
          <table class="display responsive nowrap" id="admin-pos-user" width="100%">
            <thead>
              <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Action</th>
              </tr>
            </thead>
          </table>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
