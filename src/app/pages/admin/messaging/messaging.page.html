<appHeader [params]="params"></appHeader>
<ion-content [fullscreen]="true">
    <ion-grid class="ion-padding">
        <h1 class="page-title mt-0 mb-20">Group Notifications by Market</h1>
        <form [formGroup]="messageForm" (ngSubmit)="onSubmit()">
            <ion-row>
                <ion-col size="12">
                    <p class="field-label">Markets</p>
                    <ion-item lines="none" detail="false" class="item-field">
                        <ion-select [multiple]="true" placeholder="Select Market(s)" formControlName="market_id" (ionChange)="onSelect($event)">
                            <ion-select-option [value]="market?.id" *ngFor="let market of markets">
                                {{market?.name}}
                            </ion-select-option>
                        </ion-select>
                        <ion-icon name="chevron-down"></ion-icon>
                    </ion-item>
                </ion-col>
                <ng-container formArrayName="contents" *ngFor="let itemForm of getPreview?.controls; let i = index">   
                    <ion-col size="12" [formGroupName]="i">
                        <p class="field-label">Notification Content for Testing Market</p>
                        <ion-item lines="none" detail="false" class="item-field">
                            <ion-textarea placeholder="Company Description" rows="8" id="editor" formControlName="content"></ion-textarea>
                        </ion-item>
                        <ion-input type="hidden" formControlName="market"></ion-input>
                    </ion-col>
                </ng-container>
            </ion-row>
            <ion-row>
                <ion-col size="12">
                    <ion-button expand="block" class="btn-success mt-20 mb-10" type="submit"
                    [disabled]="!messageForm.valid">Submit</ion-button>        
                </ion-col>        
            </ion-row>
        </form>
    </ion-grid>
</ion-content>
