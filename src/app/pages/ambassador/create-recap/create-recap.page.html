<appHeader [params]="params"></appHeader>
<ion-content [fullscreen]="true">
    <ion-grid>
        <ion-row *ngIf="events?.length>0">
          <ion-col size="12">
            <ion-item lines="none" detail="false" class="item-field">
              <ion-select placeholder="Select unsubmitted recap" [(ngModel)]="type" (ionChange)="getStatusWise($event)">
                <ion-select-option value="">All</ion-select-option>
                <ion-select-option *ngFor="let event of events" [innerHTML]="event?.event_name" [value]="event?.id"></ion-select-option>
              </ion-select>
            </ion-item>
          </ion-col>
        </ion-row>
        <ion-row>
            <ion-col size="12">
                <div class="table-responsive">
                    <table class="display responsive nowrap" id="ambassador_create_recap" width="100%">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>City</th>
                                <!-- <th>Status</th> -->
                                <th>Action</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </ion-col>            
        </ion-row>
    </ion-grid>

</ion-content>
