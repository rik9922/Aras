<appHeader [params]="params"></appHeader>
<ion-content [fullscreen]="true">
  <ion-grid class="ion-padding">

    <!-- ── Filter: unsubmitted recap by event ──────────────────────────── -->
    <ion-row *ngIf="events.length > 0">
      <ion-col size="12">
        <ion-item lines="none" detail="false" class="item-field">
          <ion-select placeholder="Select unsubmitted recap"
            [(ngModel)]="type"
            (ionChange)="getStatusWise($event)">
            <ion-select-option value="">All</ion-select-option>
            <ion-select-option *ngFor="let event of events"
              [innerHTML]="event?.event_name"
              [value]="event?.id"></ion-select-option>
          </ion-select>
        </ion-item>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">

        <!-- Column header bar with DATE & TIME sort (kept mounted during load
             so the sort control never disappears on reload). -->
        <div class="recap-list-header" *ngIf="isLoading || recaps.length > 0">
          <button class="recap-list-header__sort-btn" (click)="toggleSort()" [disabled]="isLoading"
            aria-label="Sort by date and time">
            DATE &amp; TIME
            <span class="recap-list-header__sort-icon" aria-hidden="true">{{ sortOrder === 'asc' ? '↑' : '↓' }}</span>
          </button>
          <span class="recap-list-header__action">ACTION</span>
        </div>

        <!-- ── Loading state (initial load only) ───────────────────────── -->
        <div *ngIf="isLoading && recaps.length === 0" class="recap-loading">
          <ion-spinner name="crescent" color="primary"></ion-spinner>
          <p>Loading recaps...</p>
        </div>

        <!-- ── Empty state ─────────────────────────────────────────────── -->
        <div *ngIf="!isLoading && recaps.length === 0" class="recap-empty">
          <ion-icon name="checkmark-done-circle-outline" class="recap-empty__icon"></ion-icon>
          <h3>All caught up</h3>
          <p>You have no recaps waiting to be submitted.</p>
        </div>

        <!-- ── Recap cards ─────────────────────────────────────────────── -->
        <div class="recap-card" *ngFor="let recap of recaps">

          <!-- Header: icon + event name + status pill -->
          <div class="recap-card__header">
            <div class="recap-card__icon-box">
              <ion-icon name="document-text-outline"></ion-icon>
            </div>
            <h3 class="recap-card__title" [innerHTML]="recap.event_name || 'Untitled Event'"></h3>
            <span class="recap-card__badge">{{ recap._statusLabel }}</span>
          </div>

          <!-- Location -->
          <div class="recap-card__info-row" *ngIf="recap.city">
            <ion-icon name="location-outline"></ion-icon>
            <span [innerHTML]="recap.city"></span>
          </div>

          <!-- Footer action -->
          <div class="recap-card__footer">
            <button class="recap-card__cta" (click)="completeIt(recap._eventId)">
              <ion-icon name="create-outline"></ion-icon>
              Complete Recap
            </button>
          </div>

        </div><!-- /recap-card -->

      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- ── Infinite scroll ───────────────────────────────────────────────── -->
  <ion-infinite-scroll threshold="100px" (ionInfinite)="loadMore($event)" [disabled]="!hasMore || isLoading">
    <ion-infinite-scroll-content loadingText="Loading more recaps..."></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
