<appHeader [params]="params"></appHeader>
<ion-content [fullscreen]="true">
    <ion-grid class="ion-padding">
        <ion-row>
            <ion-col size="12">
                <ion-segment [(ngModel)]="type" (ionChange)="getStatusWise($event)">
                    <ion-segment-button value="all">
                        <ion-label>Available</ion-label>
                    </ion-segment-button>
                    <ion-segment-button value="pending">
                        <ion-label>Pending</ion-label>
                    </ion-segment-button>
                    <ion-segment-button value="assigned">
                        <ion-label>Assigned</ion-label>
                    </ion-segment-button>
                    <ion-segment-button value="completed">
                        <ion-label>Completed</ion-label>
                    </ion-segment-button>
                </ion-segment>
            </ion-col>
        </ion-row>
        <ion-row *ngIf="markets?.length>0 && type == 'completed'">
            <ion-col size="12">
                <ion-item lines="none" detail="false" class="item-field">
                    <ion-select placeholder="Select Market" [(ngModel)]="market_id" (ionChange)="market_change()">
                        <ion-select-option [value]="market?.id" [innerHTML]="market?.name"
                            *ngFor="let market of markets"></ion-select-option>
                    </ion-select>
                </ion-item>
            </ion-col>
            <ion-col size="6">
                <ion-item lines="none" detail="false" class="item-field">
                    <ion-input type="date" (ionChange)="getStatusWise($event)" [(ngModel)]="start_date"></ion-input>
                </ion-item>
            </ion-col>
            <ion-col size="6">
                <ion-item lines="none" detail="false" class="item-field">
                    <ion-input type="date" (ionChange)="getStatusWise($event)" [(ngModel)]="end_date"></ion-input>
                </ion-item>
            </ion-col>
        </ion-row>
        <ion-row *ngIf="type == 'assigned'">
            <ion-col size="12">
                <ion-note class="check-in-help">
                    Tap the <strong>location</strong> icon to check in, or the <strong>eye</strong> icon for event details.
                </ion-note>
            </ion-col>
        </ion-row>
        <ion-row>
            <ion-col size="12">
                <div class="table-responsive">
                    <table *ngIf="tableVisible" id="ambassador_event" class="display responsive nowrap fontweight-normal" width="100%">
                        <thead>
                            <ng-container *ngIf="type == 'all'">
                                <tr>
                                    <th>Date-Time</th>
                                    <!-- <th>Duration</th> -->
                                    <th>Brand</th>
                                    <th>Varietals</th>
                                    <th>Kit Required</th>
                                    <th>Location</th>
                                    <th>City</th>
                                    <th>Event Pay</th>
                                    <th>Driver Time Pay</th>
                                    <!-- <th>Status</th> -->
                                    <th>Action</th>
                                </tr>
                            </ng-container>
                            <ng-container *ngIf="type == 'completed'">
                                <tr>
                                    <th>Date/Time</th>
                                    <th>Brand</th>
                                    <th>Location</th>
                                    <th>Event Pay</th>
                                    <th>Action</th>
                                </tr>
                            </ng-container>
                            <ng-container *ngIf="type == 'assigned'">
                                <tr>
                                    <th>Date</th>
                                    <th style="width: 200px;">Time</th>
                                    <th>Location</th>
                                    <th>Brand</th>
                                    <th>Actions</th>
                                </tr>
                            </ng-container>
                            <ng-container *ngIf="type == 'pending'">
                                <tr>
                                    <th>Date</th>
                                    <th style="width: 200px;">Time</th>
                                    <th>Location</th>
                                    <th>Brand</th>
                                    <th>Apply</th>
                                </tr>
                            </ng-container>
                        </thead>
                    </table>
                </div>
            </ion-col>
        </ion-row>
    </ion-grid>

</ion-content>
