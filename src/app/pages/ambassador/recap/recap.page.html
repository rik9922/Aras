<appHeader [params]="params"> </appHeader>

<ion-content [fullscreen]="true">
  <ion-grid>
      <ion-row>
        <ion-col size="12">
          <ion-button expand="block" class="btn-primary mt-20 mb-10" >Search</ion-button>
        </ion-col>
        <ion-col size="12">
            <div class="table-responsive">
              <table class="display responsive nowrap" id="recap" width="100%">
                <thead>
                  <tr>
                    <th>Event Name</th>
                    <th>Event City</th>
                    <th>Action</th>
                  </tr>
                </thead>                
              </table>
            </div>  
        </ion-col>
      </ion-row>
  </ion-grid>

</ion-content>
