<appHeader [params]="params"></appHeader>
<ion-content [fullscreen]="true">
    <ion-grid>
        <ion-row>
          <ion-col size="6">
            <ion-item lines="none" detail="false" class="item-field">
              <ion-input type="date" (ionChange)="getStatusWise($event)" [(ngModel)]="start_date"></ion-input>
            </ion-item>
          </ion-col>
          <ion-col size="6">
            <ion-item lines="none" detail="false" class="item-field">
              <ion-input type="date" (ionChange)="getStatusWise($event)" [(ngModel)]="end_date"></ion-input>
            </ion-item>
          </ion-col>
          <ion-col size="12">
               <ion-button expand="block" class="btn-primary-outline mt-20 mb-10" (click)="reset()">Reset</ion-button>
          </ion-col>
        </ion-row>
        <ion-row>
            <ion-col size="12">
                <div class="table-responsive">
                    <table class="display responsive nowrap" id="ambassador_payment" width="100%">
                        <thead>
                            <tr>
                                <th>Location</th>
                                <th>Brand</th>
                                <th>Event Pay</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </ion-col>            
        </ion-row>
    </ion-grid>

</ion-content>
