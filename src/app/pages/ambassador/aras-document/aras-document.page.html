<appHeader [params]="params"></appHeader>
<ion-content [fullscreen]="true">
    <ion-grid class="ion-padding"> 
      <ion-row>
        <ion-col  size="12" class="upload-section" (click)="select_file()">
          <ion-icon name="cloud-upload"></ion-icon>
          <ion-text>Tap to upload document</ion-text>
          <ion-note>JPG, JPEG, PNG, or PDF</ion-note>
        </ion-col>
        <input type="file" hidden name="document" (change)="onChange($event)" accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf"/>
      </ion-row>
        <ion-row>
            <ion-col size="12">
                <div class="table-responsive">
                    <table class="display responsive nowrap" id="ambassador_aras_document" width="100%">
                        <thead>
                            <tr>
                                <th>File</th>
                                <th>View</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </ion-col>            
        </ion-row> 
    </ion-grid>

</ion-content>
