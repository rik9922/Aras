<appHeader [params]="params"></appHeader>
<ion-content [fullscreen]="true">
    <ion-grid>
        <ion-row>
            <ion-col size="12">
                <ion-button *ngIf="!isSpinner" expand="block" (click)="searchClicked()" class="btn-primary mt-10">
                    <ion-icon name="search"></ion-icon>Search
                </ion-button>
            </ion-col>
        </ion-row>
        <ion-row>
            <ion-col size="12">
                <div class="table-responsive">
                    <table id="location_event" class="display responsive nowrap" width="100%">
                        <thead>
                            <tr>
                                <th>Day</th>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Brand</th>
                                <th>Distributor</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                    </table>
                </div>
            </ion-col>
        </ion-row>
    </ion-grid>
</ion-content>
  <ion-modal trigger="open-modal" [isOpen]="isSearch">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button (click)="searchClicked()" color="light">Cancel</ion-button>
          </ion-buttons>
          <ion-title>Search</ion-title>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding">
            <ion-grid>
                 <ion-row>
                    <ion-col *ngIf="isSearch" size="12">
                        <form [formGroup]="eventForm">
                            <ion-col size="12">
                                <p class="field-label">Select Departments</p>
                                <ion-item lines="none" detail="false" class="item-field">
                                    <ion-select (ionChange)="onChange($event,'department_id')" placeholder="Select Departments"
                                        formControlName="department_id">
                                        <ion-select-option [value]="department?.id"
                                            *ngFor="let department of data?.departments">
                                            {{department?.name}}
                                        </ion-select-option>
                                    </ion-select>
                                    <ion-icon name="chevron-down" class="drop-down-arrow"></ion-icon>
                                </ion-item>
                            </ion-col>

                            <ion-col size="12">
                                <p class="field-label">Select Market(s)</p>
                                <ion-item lines="none" detail="false" class="item-field">
                                    <ion-select (ionChange)="onChange($event,'market_id')" placeholder="Select Market(s)"
                                        formControlName="market_id">
                                        <ion-select-option [value]="market?.id" *ngFor="let market of data?.markets">
                                            {{market?.name}}
                                        </ion-select-option>
                                    </ion-select>
                                    <ion-icon name="chevron-down" class="drop-down-arrow"></ion-icon>
                                </ion-item>
                            </ion-col>

                            <!-- Venue Type filter not used
                            <ion-col size="12">
                                <p class="field-label">Event Type</p>
                                <ion-item lines="none" detail="false" class="item-field">
                                    <ion-select (ionChange)="onChange($event,'venue_id')" placeholder="Select Event Id"
                                        formControlName="venue_id">
                                        <ion-select-option [value]="venueType?.id" *ngFor="let venueType of data?.venueTypes">
                                            {{venueType?.name}}
                                        </ion-select-option>
                                    </ion-select>
                                    <ion-icon name="chevron-down" class="drop-down-arrow"></ion-icon>
                                </ion-item>
                            </ion-col>
                            -->
                            <ion-col size="12">
                                <p class="field-label">Distributors</p>
                                <ion-item lines="none" detail="false" class="item-field">
                                    <ion-select (ionChange)="onChange($event,'distributor_id')" placeholder="Select Distributor"
                                        formControlName="distributor_id">
                                        <ion-select-option [value]="distributor?.id"
                                            *ngFor="let distributor of data?.distributors">
                                            {{distributor?.name}}
                                        </ion-select-option>
                                    </ion-select>
                                    <ion-icon name="chevron-down" class="drop-down-arrow"></ion-icon>
                                </ion-item>
                            </ion-col>
                            <ion-col size="12">
                                <p class="field-label">Select Event Id</p>
                                <ion-item lines="none" detail="false" class="item-field">
                                    <ion-select (ionChange)="onChange($event,'event_id')" placeholder="Select Event Id"
                                        formControlName="event_id">
                                        <ion-select-option [innerHTML]="event?.event_name + ' (' + event?.id + ')'"
                                            [value]="event?.id" *ngFor="let event of filterEvents">
                                        </ion-select-option>
                                    </ion-select>
                                    <ion-icon name="chevron-down" class="drop-down-arrow"></ion-icon>
                                </ion-item>
                            </ion-col>

                            <ion-col size="12">
                                <p class="field-label">Ambassador Name</p>
                                <ion-item lines="none" detail="false" class="item-field">
                                    <ion-select (ionChange)="onChange($event,'ambassador_name')"
                                        placeholder="Select Ambassador Name " formControlName="ambassador_name">
                                        <ion-select-option [value]="ambassador?.id"
                                            *ngFor="let ambassador of data?.ambassadors">
                                            {{ambassador?.name}}
                                        </ion-select-option>
                                    </ion-select>
                                    <ion-icon name="chevron-down" class="drop-down-arrow"></ion-icon>
                                </ion-item>
                            </ion-col>

                            <ion-col size="12">
                                <p class="field-label">Varietals</p>
                                <ion-item lines="none" detail="false" class="item-field">
                                    <ion-input formControlName="varietals" (ionBlur)="onInput($event,'varietals')"
                                        placeholder="Search here.."> </ion-input>
                                </ion-item>
                            </ion-col>

                            <ion-col size="12">
                                <p class="field-label">Brand</p>
                                <ion-item lines="none" detail="false" class="item-field">
                                    <ion-select (ionChange)="onChange($event,'brand_id')" placeholder="Select Brand"
                                        formControlName="brand_id">
                                        <ion-select-option [value]="brand?.id" *ngFor="let brand of data?.brands">
                                            {{brand?.brand_name}}
                                        </ion-select-option>
                                    </ion-select>
                                    <ion-icon name="chevron-down" class="drop-down-arrow"></ion-icon>
                                </ion-item>
                            </ion-col>
                        </form>
                        <ion-button (click)="resetForm()" class="btn-primary" expand="block">Reset</ion-button>
                    </ion-col>
                </ion-row>
            </ion-grid>
      </ion-content>
    </ng-template>
  </ion-modal>
